[package]
name         = "swe-edge-egress-database-migration"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "Database migration runner for swe-edge — MigrationRunner trait with sqlx-backed implementations behind postgres/sqlite/mysql feature flags."
keywords     = ["migration", "database", "sqlx", "sea", "swe"]
categories   = ["database"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "processor"

[lib]
path = "src/lib.rs"

[features]
default  = []
# Each flag compiles in the named driver AND the Any runtime dispatcher.
# Multiple flags can be active simultaneously — the URL scheme selects
# the driver at runtime: postgres://, sqlite://, mysql://.
postgres = ["sqlx/postgres", "sqlx/runtime-tokio-native-tls", "sqlx/any"]
sqlite   = ["sqlx/sqlite",   "sqlx/runtime-tokio-native-tls", "sqlx/any"]
mysql    = ["sqlx/mysql",    "sqlx/runtime-tokio-native-tls", "sqlx/any"]

[dependencies]
thiserror.workspace   = true
async-trait.workspace = true
futures.workspace     = true
serde.workspace       = true
tokio                 = { workspace = true, features = ["rt"] }
sqlx                  = { workspace = true, optional = true, features = ["macros", "migrate", "any"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
