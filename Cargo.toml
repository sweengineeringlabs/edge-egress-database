[workspace]
resolver = "2"
members  = ["main/migration"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge"

[workspace.dependencies]
thiserror   = "2"
futures     = "0.3"
serde       = { version = "1.0", features = ["derive"] }
tokio       = { version = "1.0" }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.1.0" }
