[workspace]
resolver = "2"
members  = ["main/features/migration"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT"
rust-version = "1.75"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge"

[workspace.dependencies]
thiserror   = "2"
async-trait = "0.1"
futures     = "0.3"
serde       = { version = "1.0", features = ["derive"] }
tokio       = { version = "1.0" }
sqlx        = { version = "0.8", default-features = false }
