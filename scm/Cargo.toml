[package]
name         = "swe-edge-egress-database-migration"
version      = "0.3.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge"
description  = "Database datasource + migration bootstrap for swe-edge — DatabaseConfig + connect_and_migrate returning a configured, migrated sqlx pool behind postgres/sqlite feature flags."
keywords     = ["migration", "database", "sqlx", "sea", "swe"]
categories   = ["database"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "processor"

[lib]
path = "main/src/lib.rs"

[features]
default  = []
postgres = ["sqlx/postgres"]
sqlite   = ["sqlx/sqlite"]
# mysql omitted: kept out of scope until a consumer needs it (matches prior posture).

[dependencies]
sqlx                   = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "migrate"] }
thiserror              = "2"
futures                = "0.3"
serde                  = { version = "1.0", features = ["derive"] }
tokio                  = { version = "1.0", features = ["rt", "rt-multi-thread"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

[dev-dependencies]
tokio                  = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tempfile               = "3"
toml                   = "0.8"
# Mirrors how a consumer (e.g. justobserv) queries the returned DbPool to back
# its edge_domain::Repository adapters — used to prove migrations + pool end-to-end.
sqlx                   = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }
futures                = "0.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[[test]]
name = "migration_runner_trait_int_test"
path = "tests/migration_runner_trait_int_test.rs"

