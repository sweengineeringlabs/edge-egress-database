[package]
name         = "swe-edge-egress-database-migration"
version      = "0.2.3"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge"
description  = "Database datasource + migration bootstrap for swe-edge — DatabaseConfig + connect_and_migrate returning a configured, migrated deadpool (over refinery drivers) behind postgres/sqlite feature flags."
keywords     = ["migration", "database", "refinery", "sea", "swe"]
categories   = ["database"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "processor"

[lib]
path = "main/src/lib.rs"

[features]
default  = []
postgres = ["dep:tokio-postgres", "refinery/tokio-postgres", "dep:deadpool-postgres"]
sqlite   = ["dep:rusqlite", "refinery/rusqlite", "dep:deadpool-sqlite"]
# mysql omitted: mysql_async pulls in rsa 0.9.x (RUSTSEC-2023-0071, no upstream fix)

[dependencies]
refinery          = { version = "0.8", default-features = false }
tokio-postgres    = { version = "0.7", optional = true }
rusqlite          = { version = "0.31", optional = true, features = ["bundled"] }
deadpool-postgres = { version = "0.14", optional = true }
deadpool-sqlite   = { version = ">=0.5", optional = true }
thiserror              = "2"
futures                = "0.3"
serde                  = { version = "1.0", features = ["derive"] }
tokio                  = { version = "1.52", features = ["rt", "rt-multi-thread"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

[dev-dependencies]
tokio                  = { version = "1.52", features = ["macros", "rt-multi-thread"] }
tempfile               = "3"
toml                   = "0.8"
rusqlite               = { version = "0.31", features = ["bundled"] }
tokio-postgres         = { version = "0.7" }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }
futures                = "0.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

